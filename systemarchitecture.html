<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Architecture</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --orange: #ff9900;
            --black: #000000;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'Roboto', sans-serif;
        }

        /* HERO */

        .hero {
            height: 300px;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle,
                    rgba(255, 153, 0, .15),
                    transparent 70%);

            border-bottom: 2px solid var(--orange);
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;

            text-shadow:
                0 0 20px var(--orange);
        }

        /* SECTION */

        .architecture {

            padding: 120px 80px;
        }

        .section-label {

            color: var(--orange);

            letter-spacing: 5px;

            margin-bottom: 15px;
        }

        .architecture h2 {

            font-size: 3rem;

            margin-bottom: 25px;
        }

        .underline {

            width: 120px;
            height: 4px;

            background: var(--orange);

            box-shadow:
                0 0 15px var(--orange);

            margin-bottom: 70px;
        }

        /* CONTAINER */

        .diagram-container {

            max-width: 1200px;

            margin: auto;

            padding: 50px;

            border: 2px solid var(--orange);

            background:
                linear-gradient(135deg,
                    rgba(255, 153, 0, .08),
                    rgba(255, 153, 0, .02));

            clip-path: polygon(25px 0,
                    100% 0,
                    100% calc(100% - 25px),
                    calc(100% - 25px) 100%,
                    0 100%,
                    0 25px);

            box-shadow:
                0 0 20px rgba(255, 153, 0, .3);
        }

        .diagram-title {

            color: var(--orange);

            font-size: 2rem;

            margin-bottom: 20px;
        }

        .separator {

            height: 1px;

            background:
                rgba(255, 153, 0, .3);

            margin-bottom: 50px;
        }

        /* MAIN MODULES */

        .module {

            width: 70%;

            margin: auto;

            padding: 25px;

            text-align: center;

            background:
                rgba(255, 153, 0, .12);

            border: 2px solid var(--orange);

            color: white;

            font-weight: 700;

            font-size: 1.4rem;

            transition: .4s;
        }

        .module:hover {

            transform:
                translateY(-8px) scale(1.03);

            box-shadow:
                0 0 25px var(--orange),
                0 0 60px rgba(255, 153, 0, .5);
        }

        /* ARROW */

        .arrow {

            text-align: center;

            font-size: 2rem;

            color: var(--orange);

            margin: 20px 0;

            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(10px);
            }
        }

        /* SUB MODULES */

        .sub-modules {

            margin-top: 40px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 25px;
        }

        .sub {

            min-height: 170px;

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;

            border: 2px solid var(--orange);

            background:
                rgba(255, 153, 0, .05);

            font-weight: 700;

            font-size: 1.2rem;

            transition: .4s;

            position: relative;

            overflow: hidden;
        }

        .sub::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(90deg,
                    transparent,
                    rgba(255, 153, 0, .15),
                    transparent);

            transition: .8s;
        }

        .sub:hover::before {
            left: 100%;
        }

        .sub:hover {

            transform:
                translateY(-10px);

            box-shadow:
                0 0 20px var(--orange),
                0 0 50px rgba(255, 153, 0, .4);
        }

        @media(max-width:900px) {

            .sub-modules {

                grid-template-columns: 1fr 1fr;
            }

            .module {
                width: 100%;
            }
        }

        @media(max-width:600px) {

            .hero h1 {
                font-size: 3rem;
            }

            .architecture {
                padding: 80px 25px;
            }

            .sub-modules {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>SYSTEM ARCHITECTURE</h1>
    </div>

    <section class="architecture">

        <p class="section-label">MODULE 03</p>

        <h2>SYSTEM OVERVIEW</h2>

        <div class="underline"></div>

        <div class="diagram-container">

            <h3 class="diagram-title">
                SYSTEM OVERVIEW DIAGRAM
            </h3>

            <div class="separator"></div>

            <div class="module">
                Authentication & Security Module
            </div>

            <div class="arrow">▼</div>

            <div class="module">
                Expense Splitter Management Engine
            </div>

            <div class="arrow">▼</div>

            <div class="sub-modules">

                <div class="sub">
                    User<br>Module
                </div>

                <div class="sub">
                    Group<br>Module
                </div>

                <div class="sub">
                    Expense<br>Module
                </div>

                <div class="sub">
                    Admin<br>Module
                </div>

            </div>

        </div>

    </section>

</body>

</html>
